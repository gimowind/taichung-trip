<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台中慢旅 11/21–11/22</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
  :root {
    --bg: #f6f7f5;
    --card: #ffffff;
    --text: #1c2520;
    --muted: #5b6660;
    --line: #e3e7e4;
    --green: #1f6b45;
    --green-soft: #e8f3ec;
    --d1: #c2410c;
    --d1-soft: #fff1e8;
    --d2: #1d4ed8;
    --d2-soft: #ebf1ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--green); }

  /* Lock */
  #auth-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .auth-box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 360px; text-align: center; }
  .auth-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
  .auth-subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .password-input { width: 100%; font-size: 1.1rem; padding: 12px; border: 1px solid var(--line); border-radius: 10px; text-align: center; letter-spacing: 4px; }
  .password-input:focus { outline: 2px solid var(--green); border-color: transparent; }
  .auth-btn { width: 100%; margin-top: 12px; padding: 12px; font-size: 1rem; font-weight: 700; color: #fff; background: var(--green); border: 0; border-radius: 10px; cursor: pointer; }
  .error-msg { display: none; margin-top: 12px; color: #b91c1c; font-size: 0.9rem; }

  #main-content { display: none; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }

  /* Header */
  .top { padding: 8px 0 12px; }
  .top h1 { font-size: 1.5rem; font-weight: 700; }
  .top .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 0.92rem; margin-top: 4px; }
  .top .meta b { color: var(--text); font-weight: 500; }

  /* Tabs */
  .tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 0; max-width: 560px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { white-space: nowrap; padding-left: 4px !important; padding-right: 4px !important; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 0.95rem; font-weight: 500; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .tab-btn[aria-selected="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .panel { display: none; padding-top: 8px; }
  .panel.active { display: block; }

  /* Overview */
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; }
  .day1 .day-head { background: var(--d1-soft); }
  .day2 .day-head { background: var(--d2-soft); }
  .day-head h2 { font-size: 1.1rem; }
  .day1 h2 { color: var(--d1); }
  .day2 h2 { color: var(--d2); }
  .day-head a { font-size: 0.85rem; font-weight: 500; text-decoration: none; }
  .sched { list-style: none; }
  .sched li { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: start; padding: 9px 16px; border-top: 1px solid var(--line); }
  .sched .t { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.95rem; }
  .day1 .t { color: var(--d1); }
  .day2 .t { color: var(--d2); }
  .sched .what { font-weight: 500; }
  .sched .note { display: block; color: var(--muted); font-size: 0.85rem; font-weight: 400; }
  .sched .pin { font-size: 0.85rem; text-decoration: none; white-space: nowrap; }
  .sched li.move .what { color: var(--muted); font-weight: 400; }
  .tbd-tag { font-style: normal; margin-left: 6px; font-size: 0.72rem; font-weight: 700; color: #92400e; background: #fef3c7; padding: 1px 6px; border-radius: 6px; vertical-align: 2px; }

  .must { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
  .must h3 { font-size: 0.95rem; margin-bottom: 4px; }
  .must ul { padding-left: 18px; font-size: 0.92rem; }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
  .card img { display: block; width: 100%; height: 170px; object-fit: cover; background: var(--line); }
  .card .body { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card h3 { font-size: 1.05rem; }
  .card .when { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; margin-right: 6px; vertical-align: 2px; }
  .when.w1 { color: var(--d1); background: var(--d1-soft); }
  .when.w2 { color: var(--d2); background: var(--d2-soft); }
  .when.w0 { color: #92400e; background: #fef3c7; }
  .card p { font-size: 0.93rem; }
  .card .info { font-size: 0.85rem; color: var(--muted); }
  .card .links { margin-top: auto; padding-top: 4px; font-size: 0.9rem; }
  .card details summary { cursor: pointer; color: var(--green); font-weight: 500; font-size: 0.9rem; }
  .card iframe { display: block; width: 100%; height: 220px; border: 0; border-radius: 10px; margin-top: 8px; }
  .credit { font-size: 0.72rem; color: var(--muted); }

  /* Info tables */
  .box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .box h3 { font-size: 1.05rem; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; width: 1%; padding-right: 14px; }
  .train { font-weight: 700; color: var(--green); }
  .small { font-size: 0.85rem; color: var(--muted); }

  .sec { font-size: 1.05rem; margin: 18px 0 8px; }
  .sec:first-child { margin-top: 4px; }
  .ytgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
  .ytgrid .box { margin-bottom: 0; }
  .ytlist { list-style: none; }
  .ytlist li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .ytlist b { font-weight: 700; }
  .ytlist .dish { margin-left: 8px; font-size: 0.9rem; }
  .ytlist .addr { display: block; font-size: 0.82rem; color: var(--muted); }
  .ytlist .pin { font-size: 0.85rem; text-decoration: none; white-space: nowrap; }
  @media (max-width: 760px) { .ytgrid { grid-template-columns: 1fr; } }
  .yt-tag { font-style: normal; margin-left: 6px; font-size: 0.72rem; font-weight: 700; color: #b91c1c; background: #fee2e2; padding: 1px 6px; border-radius: 6px; vertical-align: 2px; }
  .sched .eat { display: block; font-size: 0.85rem; font-weight: 400; margin-top: 2px; color: #7c2d12; }
  .day2 .sched .eat { color: #1e3a8a; }
  .sched .eat a { color: inherit; font-weight: 500; }
  .ytlist .hrs { display: block; font-size: 0.85rem; margin-top: 2px; }
  .ytlist .hrs span { margin-right: 10px; }
  span.d1 { color: var(--d1); font-weight: 500; }
  span.d2 { color: var(--d2); font-weight: 500; }
  .ytlist .fnote { display: block; font-size: 0.8rem; color: #92400e; }
  .ytlist li.flash { background: #fef9c3; border-radius: 8px; transition: background 0.6s; }
  .ytlist li { scroll-margin-top: 64px; padding-left: 4px; padding-right: 4px; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 24px 0 32px; }

  @media (max-width: 760px) {
    .days { grid-template-columns: 1fr; }
    .top h1 { font-size: 1.3rem; }
  }
</style>
</head>

    function unlockContent(pwd) {
      const password = pwd || document.getElementById("password-input").value;
      try {
        const html = CryptoJS.AES.decrypt(ENCRYPTED_PAYLOAD, password).toString(CryptoJS.enc.Utf8);
        if (html && html.length > 50) {
          const main = document.getElementById("main-content");
          main.innerHTML = html;
          document.getElementById("auth-overlay").style.display = "none";
          main.style.display = "block";
          try { sessionStorage.setItem("saved_trip_key", password); } catch (e) {}
          let tab = "plan";
          try { tab = localStorage.getItem("trip_tab") || "plan"; } catch (e) {}
          showTab(tab);
        } else { throw new Error("bad"); }
      } catch (e) {
        document.getElementById("error-msg").style.display = "block";
        document.getElementById("password-input").value = "";
      }
    }

    function showTab(id) {
      const btns = document.querySelectorAll(".tab-btn");
      if (!document.getElementById("tab-" + id)) id = "plan";
      btns.forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id ? "true" : "false"));
      document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "tab-" + id));
      try { localStorage.setItem("trip_tab", id); } catch (e) {}
    }

    document.addEventListener("click", function (e) {
      const b = e.target.closest("[data-tab]");
      if (!b) return;
      e.preventDefault();
      showTab(b.dataset.tab);
      const t = b.dataset.target && document.getElementById(b.dataset.target);
      if (t) {
        t.scrollIntoView({ block: "start" });
        t.classList.add("flash");
        setTimeout(() => t.classList.remove("flash"), 1600);
      } else { window.scrollTo({ top: 0 }); }
    });

    document.getElementById("password-input").addEventListener("keypress", function (e) {
      if (e.key === "Enter") unlockContent();
    });

    window.addEventListener("DOMContentLoaded", function () {
      let k = null;
      try { k = sessionStorage.getItem("saved_trip_key"); } catch (e) {}
      if (k) unlockContent(k);
    });
  </script>
